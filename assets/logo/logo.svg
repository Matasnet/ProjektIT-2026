      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#78501e" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect id="bg" width="512" height="512" rx="112" fill="#ede9fe" />

  <g id="content" transform="translate(0 14)">
    <circle cx="370" cy="142" r="88" fill="#fcd34d" opacity="0.35" />
    <circle cx="370" cy="142" r="64" fill="#fcd34d" />

    <g filter="url(#shadow)" font-family="Nunito, 'Arial Rounded MT Bold', Arial, sans-serif" font-weight="900" font-size="84" text-anchor="middle">
      <g transform="rotate(6 170 190)">
